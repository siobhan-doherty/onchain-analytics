repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pandas-stubs
          - dbt-core
          - dbt-duckdb
          - dagster
          - dagster-dbt
        args: [--ignore-missing-imports, --explicit-package-bases]
        exclude: ^seeds/|^data/|^target/
