name: "onchain_analytics"
version: "1.0.0"
profile: "onchain_analytics"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  onchain_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: table
      graph:
        +materialized: table
      token_transfers:
        +materialized: table
    intermediate:
      +materialized: table
      graph:
        +materialized: table
      token_transfers:
        +materialized: table
    marts:
      +materialized: table
      core:
        +materialized: table
        token_transfers:
          +materialized: table
        enrichment:
          +materialized: table
      defi:
        +materialized: table
    enrichment:
      +materialized: table
      nansen:
        +materialized: table
      token_terminal:
        +materialized: table

seeds:
  onchain_analytics:
    # raw_dex_trades removed, loaded by fetch_dex_trades.py
    raw_graph_domains:
      +column_types:
        domain_id: VARCHAR
        name: VARCHAR
        owner_address: VARCHAR
        created_at: VARCHAR
        expiry_date: VARCHAR
