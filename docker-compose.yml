services:
    dbt:
        build: .
        environment:
            DUNE_API_KEY: ${DUNE_API_KEY}
            DUNE_QUERY_ID: ${DUNE_QUERY_ID:-7494336}
            RAW_DEX_TRADES_CSV: /app/data/raw_dex_trades.csv
        volumes:
            - ./data:/app/data
            - ./target:/app/target
            - ./logs:/app/logs
        healthcheck:
            test: ["CMD", "duckdb", "/app/data/dex_analytics.duckdb", "SELECT 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    dagster:
        build: .
        command: sh -c "dbt deps && dbt parse && dagster-webserver -f /app/dagster/dagster_assets.py -h 0.0.0.0 -p 3000"
        ports:
            - "3000:3000"
        environment:
            DAGSTER_HOME: /opt/dagster/dagster_home
            DUNE_API_KEY: ${DUNE_API_KEY}
            DUNE_QUERY_ID: ${DUNE_QUERY_ID:-7494336}
        volumes:
            - ./data:/app/data
            - ./target:/app/target
            - ./logs:/app/logs
            - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
        depends_on:
            - postgres   # array format

    dagster-daemon:
        build: .
        command: dagster-daemon run
        environment:
            DAGSTER_HOME: /opt/dagster/dagster_home
            DUNE_API_KEY: ${DUNE_API_KEY}
            DUNE_QUERY_ID: ${DUNE_QUERY_ID:-7494336}
        volumes:
            - ./data:/app/data
            - ./target:/app/target
            - ./logs:/app/logs
            - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
        depends_on:
            - postgres

    postgres:
        image: postgres:13
        environment:
            POSTGRES_USER: dagster
            POSTGRES_PASSWORD: dagster
            POSTGRES_DB: dagster
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
            interval: 10s
            timeout: 5s
            retries: 5
