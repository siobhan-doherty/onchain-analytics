version: 2

models:
  - name: fct_dex_trades
    description: "Fact table with one row per DEX trade, filtered to positive USD amount."
    columns:
      - name: block_time
        description: "UTC timestamp of the trade"
        tests:
          - not_null
      - name: tx_hash
        description: "Transaction hash"
        tests:
          - not_null
      - name: evt_index
        tests:
          - not_null
      - name: amount_usd
        description: "Trade value in USD"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tx_hash
            - evt_index

  - name: dim_tokens
    description: "Dimension table of unique token symbols traded."
    columns:
      - name: token_id
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: token_symbol
        description: "Token symbol, for example ETH, USDC"
        tests:
          - not_null
