version: 2

models:
  - name: fct_dex_daily_metrics
    description: "Daily aggregated metrics by blockchain and DEX."
    columns:
      - name: trade_date
        description: "Date of trades UTC"
        tests:
          - not_null
      - name: total_volume_usd
        description: "Total USD volume for that day"
        tests:
          - not_null
      - name: unique_traders
        description: "Distinct taker addresses"
        tests:
          - not_null
