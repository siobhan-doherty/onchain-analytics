onchain_analytics:
  target: clickhouse
  outputs:
    clickhouse:
      type: clickhouse
      driver: http
      host: localhost
      port: 8123
      user: default
      password: ""
      database: onchain_analytics
      schema: default
      threads: 4
      timeout: 300
      retries: 3
      connect_timeout: 10
      send_receive_timeout: 300
      verify: False
